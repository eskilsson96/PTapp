name: FitCraft iOS test build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit and UI tests
        run: bash scripts/test-ios.sh
      - name: Upload simulator test app
        uses: actions/upload-artifact@v4
        with:
          name: FitCraft-Simulator
          path: build/FitCraft-Simulator.zip
          if-no-files-found: error
      - name: Upload results and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FitCraft-Test-Results
          path: build/*.xcresult
          if-no-files-found: warn
